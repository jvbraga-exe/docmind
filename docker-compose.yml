services:
  postgres:
    image: pgvector/pgvector:pg16
    ports: ["127.0.0.1:5436:5432"]
    environment:
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: docmind
      POSTGRES_DB: docmind
    volumes: ["docmind_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmind"]
      interval: 3s
      retries: 15
volumes:
  docmind_pg:
